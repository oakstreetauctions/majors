<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Oak Street">
<meta name="theme-color" content="#006747">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>Oak Street Auctions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@500;700&family=Libre+Franklin:ital,wght@0,500;0,700;1,500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ec;--card:#ffffff;--fg:#1c2a21;--mut:#6d7468;--line:#e6e2d4;--row:#faf9f4;
  --green:#006747;--deep:#00543a;--gold:#f2c94c;--under:#c8102e;--over:#006747;--pos:#006747;--neg:#c8102e;
  --hdr:#006747;--hdrfg:#ffffff;--th:#006747;--thfg:#ffffff;--shadow:0 1px 2px rgba(28,42,33,.06),0 4px 14px rgba(28,42,33,.04);
  --serif:"Libre Caslon Text",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b120e;--card:#131c17;--fg:#eef1ea;--mut:#9aa396;--line:#253029;--row:#17211b;
  --green:#4fb98a;--deep:#003a28;--under:#ff6b6b;--over:#5fca98;--pos:#5fca98;--neg:#ff7a72;--hdr:#00422d;--th:#0a4a34;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#0b120e;--card:#131c17;--fg:#eef1ea;--mut:#9aa396;--line:#253029;--row:#17211b;
  --green:#4fb98a;--deep:#003a28;--under:#ff6b6b;--over:#5fca98;--pos:#5fca98;--neg:#ff7a72;--hdr:#00422d;--th:#0a4a34;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
header{background:var(--hdr);color:var(--hdrfg);padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 14px;text-align:center}
header h1{margin:0;font:400 27px/1.1 var(--serif);letter-spacing:.06em}
header .rule{width:44px;height:1px;background:var(--gold);margin:10px auto 0;opacity:.9}
nav{position:sticky;top:0;z-index:5;background:var(--hdr);display:flex;padding:0 8px;justify-content:center;border-bottom:1px solid rgba(255,255,255,.08);box-shadow:0 2px 8px rgba(0,0,0,.08)}
nav button{flex:1 1 0;max-width:160px;appearance:none;border:0;background:none;color:rgba(255,255,255,.66);font:600 11.5px Inter,sans-serif;letter-spacing:.11em;text-transform:uppercase;padding:13px 2px 11px;border-bottom:2px solid transparent;cursor:pointer;transition:color .15s}
nav button:hover{color:#fff}
nav button.on{color:#fff;border-bottom-color:var(--gold)}
.wrap{max-width:760px;margin:0 auto;padding:16px 12px calc(36px + env(safe-area-inset-bottom,0px))}
.status{display:flex;align-items:center;gap:12px;justify-content:center;font:italic 400 14px var(--serif);color:var(--green);margin:2px 0 14px}
.status::before,.status::after{content:"";height:1px;width:38px;background:var(--gold)}
.status b{font-weight:400}
.status{flex-wrap:wrap}.stale{flex-basis:100%;text-align:center;font:500 11px Inter,sans-serif;font-style:normal;color:var(--mut);margin-top:-2px}
.status .stale{order:3}
.pick{position:relative;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:0 12px;height:46px;margin:0 0 14px;box-shadow:var(--shadow)}
.pick .lbl{font:600 10px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);flex:0 0 auto}
.pick .sw{width:12px;height:12px;border-radius:3px;flex:0 0 auto;border:1px solid var(--line)}
.pick .val{flex:1;min-width:0;font:600 14px Inter,sans-serif;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .car2{color:var(--green);font-size:11px;flex:0 0 auto}
.pick select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.tag{display:inline-flex;align-items:center;justify-content:center;min-width:32px;flex:0 0 auto;height:20px;padding:0 5px;border-radius:3px;font:700 10.5px Inter,sans-serif;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow)}
.sec{font:400 15px var(--serif);color:var(--green);padding:12px 12px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.sec span:last-child:not(:first-child){font:600 10.5px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.lb .r{display:grid;grid-template-columns:30px 3px minmax(0,1fr) 36px 44px 30px;align-items:center;gap:6px;padding:9px 10px 9px 10px;border-bottom:1px solid var(--line)}
.lb .r:last-child{border-bottom:0}
.lb .r:not(.h):nth-child(odd){background:var(--row)}
.lb .h,th,.lot.h{background:var(--th)!important;color:var(--thfg)!important;font:600 10.5px Inter,sans-serif!important;letter-spacing:.12em!important;text-transform:uppercase;border-bottom:0!important}
.lb .h{padding-top:9px;padding-bottom:9px;letter-spacing:.04em!important;font-size:9.5px!important}
.bar{width:3px;height:32px;border-radius:2px;background:transparent}
.pos{font:600 14px Inter,sans-serif;color:var(--fg);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pos .t{font-size:10px;font-weight:600;color:var(--mut);margin-right:1px;vertical-align:1px}
.nm{min-width:0}
.nm b{display:flex;align-items:baseline;font-weight:600;font-size:14px;letter-spacing:-.005em;min-width:0}
.nm b .n1{min-width:0;line-height:1.2;overflow-wrap:anywhere}
.lc{text-align:center;font:italic 400 12.5px var(--serif);color:var(--mut);line-height:1.1}
.nm small{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:11px;letter-spacing:.03em;margin-top:3px;white-space:nowrap;overflow:hidden}
.nm small .tag{height:16px;min-width:28px;font-size:9.5px}
.sc{text-align:right;font-weight:700;font-size:15.5px;font-variant-numeric:tabular-nums}
.under{color:var(--under)}.over{color:var(--over)}
.th{text-align:center;color:var(--mut);font-size:12px}
.mo{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:12.5px}
.mo:empty::after{content:"–";color:var(--line)}
.dim{opacity:.25}
.me td{background:rgba(242,201,76,.16)!important}
.selbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:4px;padding:10px 12px;margin:0 0 14px;box-shadow:var(--shadow)}
.selbar .who2{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.selbar .nums{font-size:12px;color:var(--mut);margin-top:3px;font-variant-numeric:tabular-nums}
.selbar .nums b{color:var(--fg);font-weight:600}
.selbar .nums b.posv{color:var(--pos)}.selbar .nums b.negv{color:var(--neg)}
.selbar button{appearance:none;border:1px solid var(--green);background:none;color:var(--green);border-radius:999px;padding:6px 12px;font:600 10.5px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.empty{padding:22px 12px;text-align:center;font:italic 400 14px var(--serif);color:var(--mut)}
.cutrow .nm b{font-weight:500;color:var(--mut)}
.cutrow .sc{font-weight:500;font-size:14px}
.rk{flex:0 0 auto;font:italic 400 12px var(--serif);color:var(--mut);margin-left:5px;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:right;padding:9px 10px}
th:first-child,td:first-child{text-align:left}
td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right}
tbody tr:nth-child(even) td{background:var(--row)}
tr:last-child td{border-bottom:0}
.who{display:flex;align-items:center;gap:9px;font-weight:600}
.posv{color:var(--pos)}.negv{color:var(--neg)}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.lot{display:grid;grid-template-columns:1fr 44px 52px 54px;gap:6px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}
.lot .ln{display:flex;align-items:center;gap:8px;min-width:0}
.lnm{display:flex;align-items:baseline;min-width:0;font-weight:600;font-size:13.5px}
.lnm .n1{min-width:0;line-height:1.2;overflow-wrap:anywhere}
.lot.rkd{grid-template-columns:34px minmax(0,1fr) 44px 52px 54px}
.lr{font:italic 400 13px var(--serif);color:var(--mut)}
.lot.h span{font-size:10px!important}
.lot .n{font-size:13px}
.lot .n{text-align:right;font-variant-numeric:tabular-nums}
.lot.h{padding:9px 10px}
details[open]>summary .car{transform:rotate(90deg)}
.car{display:inline-block;color:var(--green);transition:transform .15s;font-size:9px;width:10px}
.sub{background:var(--row);border-bottom:1px solid var(--line);padding:4px 10px 6px 28px}
.sub div{display:grid;grid-template-columns:1fr 46px 40px 56px;gap:8px;padding:5px 0;font-size:13px;border-bottom:1px dotted var(--line)}
.sub div:last-child{border-bottom:0}
.sub div span:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font:600 9.5px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;border-radius:2px;border:1px solid var(--line);color:var(--mut);margin-top:5px}
.badge.final{background:var(--green);border-color:var(--green);color:#fff}
.pay td{vertical-align:top}
.pay td b{font-weight:600}
.pay .holders{display:flex;flex-direction:column;gap:5px;align-items:flex-start;text-align:left}
.pay .holders div{display:flex;gap:7px;align-items:center;font-size:13px}
.pot{display:flex;flex-direction:column;align-items:center;padding:18px 12px 16px;gap:2px}
.pot span:first-child{font:600 10.5px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.pot span:last-child{font:400 32px/1.1 var(--serif);color:var(--green)}
.note{font:italic 400 12.5px var(--serif);color:var(--mut);padding:0 4px 12px;text-align:center}
.err{background:#fff3cd;color:#664d03;border:1px solid #ffe08a;border-radius:4px;padding:8px 10px;margin-bottom:10px;font-size:12px}
footer{text-align:center;font:italic 400 12px var(--serif);color:var(--mut);padding:4px 0 0}
@media (max-width:380px){.lb .r{grid-template-columns:26px 3px minmax(0,1fr) 34px 40px 26px;gap:5px}nav button{letter-spacing:.08em;font-size:11px}}

/* ===== per-major themes (set automatically from the ESPN event name) ===== */
html[data-ev="pga"]{--hdr:#00205B;--th:#00205B;--green:#00205B;--over:#00205B;--gold:#C9A961;--serif:"Cinzel",Georgia,serif}
html[data-ev="usopen"]{--hdr:#00365F;--th:#00365F;--green:#00365F;--over:#00365F;--gold:#BF0D3E;--serif:"Libre Franklin",Inter,sans-serif}
html[data-ev="open"]{--hdr:#0B2545;--th:#0B2545;--green:#0B2545;--over:#0B2545;--gold:#FFD100;--serif:"Cormorant Garamond",Georgia,serif}
html[data-ev="fedex"]{--hdr:#4D148C;--th:#4D148C;--green:#4D148C;--over:#4D148C;--gold:#FF6200;--serif:"Montserrat",Inter,sans-serif}
@media (prefers-color-scheme:dark){
  html[data-ev="pga"]:not([data-theme="light"]){--hdr:#0d1d44;--th:#132a5e;--green:#9db7ff;--over:#9db7ff}
  html[data-ev="usopen"]:not([data-theme="light"]){--hdr:#062a47;--th:#0b3a63;--green:#8cc2f0;--over:#8cc2f0}
  html[data-ev="open"]:not([data-theme="light"]){--hdr:#071a33;--th:#0f2c52;--green:#ffd75a;--over:#9fbbe0}
  html[data-ev="fedex"]:not([data-theme="light"]){--hdr:#2e0b57;--th:#45177d;--green:#c9a3ff;--over:#c9a3ff}}
html[data-ev="pga"] header h1{text-transform:uppercase;letter-spacing:.12em;font-size:23px}
html[data-ev="usopen"] header h1{font-weight:700;letter-spacing:.02em;text-transform:uppercase;font-size:24px}
html[data-ev="open"] header h1{font-weight:600;font-size:30px}
html[data-ev="fedex"] header h1{font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:22px}
/* ===== movement arrows ===== */
.pos{display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1.1}
.lb .h span:first-child{text-align:center}
.mvc{text-align:right}
.mv{font:600 10.5px Inter,sans-serif;font-style:normal;letter-spacing:.01em;white-space:nowrap}
.mv.up{color:var(--pos)}.mv.dn{color:var(--neg)}
.lb .r[data-p]{cursor:pointer}
.lb .r[data-p]:active{filter:brightness(.97)}
/* ===== scorecard sheet ===== */
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.on{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(10,20,14,.45);animation:fade .15s}
.sheet-card{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--bg);border-radius:14px 14px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.25);animation:up .2s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:640px){.sheet-card{left:50%;right:auto;width:600px;transform:translateX(-50%);bottom:auto;top:8vh;border-radius:8px;animation:fade .15s}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sc-head{background:var(--hdr);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:1}
.sc-head h3{margin:0;font:400 21px/1.15 var(--serif);padding-right:36px}
.sc-head .meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:rgba(255,255,255,.8);flex-wrap:wrap}
.sc-head .x{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:none;color:#fff;font-size:16px;cursor:pointer}
.sc-head .big{margin-left:auto;font:700 18px Inter,sans-serif}
.rtabs{display:flex;gap:6px;padding:12px 16px 4px}
.rtabs button{flex:1;appearance:none;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:4px;padding:8px 0;font:600 11px Inter,sans-serif;letter-spacing:.1em;cursor:pointer}
.rtabs button.on{background:var(--green);border-color:var(--green);color:#fff}
.rtabs button:disabled{opacity:.35;cursor:default}
.scw{padding:8px 12px 16px}
.sct{width:100%;border-collapse:collapse;table-layout:fixed;background:var(--card);border:1px solid var(--line);margin-bottom:10px;font-variant-numeric:tabular-nums}
.sct th,.sct td{padding:6px 0!important;text-align:center!important;font-size:12.5px;border-bottom:1px solid var(--line)}
.sct th{font-size:10px!important;letter-spacing:.04em!important}
.sct td.lab,.sct th:first-child{font:600 9px Inter,sans-serif!important;letter-spacing:.06em!important;text-transform:uppercase;text-align:left!important;padding-left:7px!important;width:50px}
.sct td.lab{color:var(--mut)}
.sct td.sum{font-weight:700;background:var(--row)}
.sct tr.par td{color:var(--mut)}
.hs{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;font-weight:600;box-sizing:border-box}
.hs.b{border:1.5px solid var(--under);border-radius:50%;color:var(--under)}
.hs.e{border:1.5px solid var(--under);border-radius:50%;color:var(--under);box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--under)}
.hs.g{border:1.5px solid var(--over);color:var(--over)}
.hs.d{border:1.5px solid var(--over);color:var(--over);box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--over)}
.sc-foot{display:flex;justify-content:space-between;padding:4px 4px 0;font-size:12px;color:var(--mut)}
.sc-foot b{color:var(--fg)}
.legend{display:flex;gap:12px;justify-content:center;font-size:11px;color:var(--mut);padding:2px 0 4px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .hs{width:15px;height:15px;font-size:0}
.tag.lite,.bar.lite{box-shadow:inset 0 0 0 1px rgba(0,0,0,.22)}
.lb .r>:nth-child(5){padding-right:6px}

/* ===== leaderboard, PGA Tour style ===== */
.plb{border-radius:4px}
.pr{display:grid;grid-template-columns:26px 34px minmax(0,1fr) 30px 34px 30px 30px;align-items:center;gap:6px;padding:0 10px;min-height:46px;border-bottom:1px solid var(--line);background:var(--card);cursor:pointer}
.pr:last-child{border-bottom:0}
.pr:active{background:var(--row)}
.pr.ph{min-height:0;padding-top:12px;padding-bottom:8px;border-bottom:2px solid var(--fg);cursor:default;font:600 10.5px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.pr.ph .c{text-align:center}
.rpill{display:inline-block;background:var(--green);color:#fff;border-radius:3px;padding:3px 6px;font-weight:700;letter-spacing:.04em}
.ppos{font:700 14.5px Inter,sans-serif;color:var(--fg);font-variant-numeric:tabular-nums}
.ptag{display:flex;align-items:center}
.ptag .tag{min-width:30px;height:19px;font-size:10px}
.nob{color:var(--line);padding-left:10px}
.pname{font:600 14.5px Inter,sans-serif;color:var(--fg);letter-spacing:-.005em;line-height:1.2;overflow-wrap:anywhere;padding:6px 0}
.prk{text-align:center;font:italic 400 12.5px var(--serif);color:var(--mut)}
.ptot,.prd{text-align:center;font:700 14.5px Inter,sans-serif;font-variant-numeric:tabular-nums;color:var(--fg)}
.prd{font-weight:500}
.pthru{text-align:center;font:600 13.5px Inter,sans-serif;color:var(--fg)}
.red{color:var(--under)!important}
.pr.cut .pname,.pr.cut .ptot{color:var(--mut);font-weight:500}
.pr.cut .pthru{font-size:10.5px;letter-spacing:.06em;color:var(--mut)}
@media (max-width:380px){.pr{grid-template-columns:22px 32px minmax(0,1fr) 28px 32px 28px 28px;gap:5px;padding:0 8px}.pname{font-size:14px}}


/* ===== event picker in the header ===== */
.evpick{position:relative;display:inline-flex;align-items:center;gap:7px;margin-top:9px;padding:4px 12px;border:1px solid rgba(255,255,255,.28);border-radius:999px;font:600 11px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#fff}
.evpick .car3{font-size:9px;opacity:.85}
.evpick select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:16px}
</style>
</head>
<body>
<header><h1>Oak Street Auctions</h1><div class="rule"></div><div class="evpick" id="evpick"></div></header>
<nav id="nav">
  <button data-v="lb" class="on">Leaderboard</button>
  <button data-v="pay">Payouts</button>
  <button data-v="st">Standings</button>
  <button data-v="lots">Auction</button>
</nav>
<div class="sheet" id="sheet"><div class="sheet-bg" data-close></div><div class="sheet-card" id="sheetCard"></div></div>
<div class="wrap">
  <div id="err"></div>
  <div class="status" id="status"></div>
  <div class="pick" id="pick"></div>
  <div id="selbar"></div>
  <div id="view"></div>
</div>
<script>
/* ====== SETTINGS ======
   For each tab: File > Share > Publish to web > pick the tab > Comma-separated values (.csv) > Publish.
   Paste the link between the quotes. Leave a slot blank to use the sample data for that tab. */
const CFG = {
  // ===== EVENTS =====  Newest first. The first one is what the site opens to.
  // espnEvent = the number after tournamentId= in the ESPN leaderboard link.
  // sheets    = published CSV links for that event's tabs (leave blank for past events;
  //             their auction data is saved inside this file).
  events: [
    { id: "2026-masters", name: "2026 Masters", espnEvent: "401811941",
      sheets: { leaderboard: "", players: "", lots: "", payouts: "", bonuses: "" } },
    { id: "2025-masters", name: "2025 Masters", espnEvent: "401703504",
      sheets: { leaderboard: "", players: "", lots: "", payouts: "", bonuses: "" } },
    { id: "2024-masters", name: "2024 Masters", espnEvent: "401580344",
      sheets: { leaderboard: "", players: "", lots: "", payouts: "", bonuses: "" } },
    { id: "2023-masters", name: "2023 Masters", espnEvent: "401465508",
      sheets: { leaderboard: "", players: "", lots: "", payouts: "", bonuses: "" } },
    { id: "2022-masters", name: "2022 Masters", espnEvent: "401353232",
      sheets: { leaderboard: "", players: "", lots: "", payouts: "", bonuses: "" } }
  ],
  // Sheet tabs: leaderboard (optional backup for ESPN), players (Player | Lot | OWGR),
  // lots (Lot | Owner | Price), payouts (Item | % of Pot), bonuses (Award | Player).
  // Bidder colors, in order of seniority (most senior first). Same for every event.

function lotLabel(p){const l=D.lots[p.lot];if(!l)return"";if(l.players.length>1)return /field/i.test(p.lot)?"Field":esc(p.lot.replace(/^group\s*/i,""));const n=D.owgrOf[p.key];return n?"#"+n:""}
function rk(p){const l=D.lots[p.lot];if(!l)return"";if(l.players.length>1)return`<span class="rk">${esc(p.lot)}</span>`;const n=D.owgrOf[p.key];return n?`<span class="rk">#${n}</span>`:""}
function shortName(p){if(p.short)return p.short;const t=p.name.replace(/\s*\(a\)\s*$/i,"").trim().split(/\s+/);
  if(t.length<2)return p.name;const f=/\./.test(t[0])?t[0]:t[0][0]+".";return f+" "+t[t.length-1]}
function lbRow(p,cut,showPos=true){const o=ownerOf(p);const wd=p.status==="wd";
  const tv=cut?p.r[1]+p.r[2]-144:p.toPar;const tot=wd?"WD":tv==null?"":fmtPar(tv);
  const thru=wd?"":cut?"CUT":(p.thru||"");const td=cut||wd?"":(p.today||"");const tdv=toPar(td);
  return`<div class="pr${cut?" cut":""}" data-p="${esc(p.key)}"><span class="ppos">${cut||!showPos?"":esc(p.pos.replace(/^T(?=\d)/,""))}</span>
  <span class="ptag">${o?tagHTML(o):'<span class="nob">–</span>'}</span><span class="pname">${esc(shortName(p))}</span>
  <span class="prk">${lotLabel(p)}</span><span class="ptot ${tv!=null&&tv<0&&!wd?"red":""}">${tot}</span><span class="pthru">${esc(thru)}</span><span class="prd ${tdv!=null&&tdv<0?"red":""}">${esc(td)}</span></div>`}
function renderLB(){
  const act=D.P.filter(p=>p.status==="active"&&mine(ownerOf(p))).sort((a,b)=>(a.toPar??99)-(b.toPar??99));
  const cut=D.P.filter(p=>p.status!=="active"&&mine(ownerOf(p))).sort((a,b)=>(a.status==="wd")-(b.status==="wd")||((a.r[1]||0)+(a.r[2]||0))-((b.r[1]||0)+(b.r[2]||0)));
  const rd=D.curRound||1;
  const head=`<div class="pr ph"><span>Pos</span><span></span><span>Player</span><span class="c">RK</span><span class="c">Tot</span><span class="c">Thru</span><span class="c"><b class="rpill">R${rd}</b></span></div>`;
  let h=`<div class="card plb">${head}${act.length?act.map((p,i)=>lbRow(p,false,i===0||act[i-1].pos!==p.pos)).join(""):`<div class="empty">${STATE.sel?"None of your golfers made the cut":"No scores yet"}</div>`}</div>`;
  if(cut.length)h+=`<div class="card plb"><div class="sec"><span>Missed cut</span><span>36 holes</span></div>${cut.map(p=>lbRow(p,true)).join("")}</div>`;
  if(D.missing.length)h+=`<div class="note">Not matched to the leaderboard (check ESPN spelling): ${D.missing.map(esc).join(", ")}</div>`;
  $("#view").innerHTML=h}
function renderST(){
  const os=Object.values(D.owners).map(o=>({...o,net:Math.round(o.won)-o.paid})).sort((a,b)=>b.net-a.net||b.won-a.won);
  let h=`<div class="card"><table><thead><tr><th>Bidder</th><th>Paid</th><th>Won</th><th>Net</th></tr></thead><tbody>`;
  os.forEach((o,i)=>{h+=`<tr class="${STATE.sel===o.name?"me":""}" data-o="${esc(o.name)}" style="cursor:pointer"><td><div class="who">${tagHTML(o)}${esc(o.name)}</div></td><td>${money(o.paid)}</td><td>${money(o.won)}</td><td class="${o.net>0?"posv":o.net<0?"negv":""}" style="font-weight:700">${money(o.net)}</td></tr>`});
  h+=`</tbody></table></div><div class="note">Projected until the tournament is final. Tap a bidder to see only their golfers.</div>`;
  $("#view").innerHTML=h}
function lotBlock(title,list,ranked){list=list.filter(l=>mine(l.owner?D.owners[l.owner]:null));if(!list.length)return"";
  let h=`<div class="card"><div class="sec"><span>${title}</span><span>${list.length}</span></div><div class="lot h${ranked?" rkd":""}">${ranked?"<span>RK</span><span>Player</span>":"<span>Lot</span>"}<span class="n">Paid</span><span class="n">Won</span><span class="n">Net</span></div>`;
  for(const l of list){const o=l.owner?D.owners[l.owner]:null;const net=Math.round(l.won)-l.price;
    const row=`${ranked?`<span class="lr">${D.owgrOf[norm(l.lot)]?"#"+D.owgrOf[norm(l.lot)]:""}</span>`:""}<span class="ln">${l.players.length>1?'<span class="car">▶</span>':""}${tagHTML(o)}<span class="lnm"><span class="n1">${esc(l.lot)}</span></span></span><span class="n">${money(l.price)}</span><span class="n">${l.won?money(l.won):"–"}</span><span class="n ${net>0?"posv":net<0?"negv":""}" style="font-weight:700">${money(net)}</span>`;
    if(l.players.length>1){const ps=l.players.map(n=>D.byKey[norm(n)]||{name:n,pos:"?",toPar:null,status:"",won:0,r:[]});
      h+=`<details class="${dimCls(o)}"><summary class="lot">${row}</summary><div class="sub">${ps.map(p=>{const cut=p.status==="cut";const v=cut?p.r[1]+p.r[2]-144:p.toPar;
        return`<div><span>${esc(p.name)}</span><span>${esc(p.status==="active"?p.pos:p.status==="cut"?"MC":p.pos)}</span><span class="${parClass(v)}">${p.status==="wd"?"WD":v==null?"":fmtPar(v)}</span><span>${p.won?money(p.won):"–"}</span></div>`}).join("")}</div></details>`}
    else h+=`<div class="lot${ranked?" rkd":""}${dimCls(o)}">${row}</div>`}
  return h+"</div>"}
function renderLots(){const all=Object.values(D.lots);
  const ind=all.filter(l=>l.players.length===1),fld=all.filter(l=>l.players.length>1&&/field/i.test(l.lot)),grp=all.filter(l=>l.players.length>1&&!/field/i.test(l.lot));
  const sw=SWAPS_NOW.length?`<div class="note">Color changes for this event: ${SWAPS_NOW.map(x=>`${esc(x.name)} → ${x.color}`).join(" · ")}</div>`:"";
  $("#view").innerHTML=(lotBlock("Individuals",ind,true)+lotBlock("Groups",grp)+lotBlock("Field",fld))+sw||`<div class="card"><div class="empty">No lots</div></div>`}
function renderPay(){
  const paid=D.awards.reduce((a,x)=>a+(x.holders.length?x.pct:0),0);
  let h=`<div class="card"><div class="pot"><span>Pot</span><span>${money(D.pot)}</span></div></div>`;
  const sect=(title,list)=>{list=list.filter(a=>!STATE.sel||a.holders.some(p=>mine(ownerOf(p))));if(!list.length)return"";let s=`<div class="card"><div class="sec"><span>${title}</span></div><table class="pay"><thead><tr><th>Award</th><th style="text-align:left">Who</th><th>Pays</th></tr></thead><tbody>`;
    for(const a of list){s+=`<tr><td><b>${esc(a.label)}</b><br><small style="color:var(--mut)">${a.pct}%${a.detail?" · "+esc(a.detail):""}</small><br><span class="badge${a.status==="Final"?" final":""}">${esc(a.status)}</span></td>
      <td><div class="holders">${a.holders.length?a.holders.filter(p=>mine(ownerOf(p))).map(p=>{const o=ownerOf(p);return`<div class="${dimCls(o)}">${tagHTML(o)}<span>${esc(p.name)}</span></div>`}).join(""):'<span style="color:var(--mut)">—</span>'}</div></td>
      <td><b>${money(a.amount)}</b>${a.holders.length>1?`<br><small style="color:var(--mut)">${money(a.amount/a.holders.length)} each</small>`:""}</td></tr>`}
    return s+"</tbody></table></div>"};
  h+=sect("Finishing position",D.awards.filter(a=>a.kind==="place"));
  h+=sect("Bonuses",D.awards.filter(a=>a.kind==="bonus"));
  if(STATE.sel&&!D.awards.some(a=>a.holders.some(p=>mine(ownerOf(p)))))h+=`<div class="card"><div class="empty">Nothing in the money yet</div></div>`;
  h+=`<div class="note">${Math.round(paid*100)/100}% of the pot is assigned right now. Ties split the combined payouts evenly.</div>`;
  $("#view").innerHTML=h}

/* ====== events ====== */
$("#nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;STATE.view=b.dataset.v;save();render();window.scrollTo(0,0)});
document.addEventListener("click",e=>{const t=e.target.closest("[data-o]");if(!t||t.closest("#nav"))return;const o=t.dataset.o;STATE.sel=STATE.sel===o?null:o;save();render()});

/* ====== themes ====== */
function evKey(n){n=String(n||"").toLowerCase();
  if(/masters/.test(n))return"masters";if(/pga championship/.test(n))return"pga";
  if(/u\.?\s?s\.? open/.test(n))return"usopen";if(/open championship|^the open/.test(n))return"open";
  if(/fedex|tour championship|st\.? jude|bmw championship|playoff/.test(n))return"fedex";return"masters"}
function applyTheme(name){const k=CFG.theme&&CFG.theme!=="auto"?CFG.theme:evKey(name);
  if(document.documentElement.dataset.ev!==k){document.documentElement.dataset.ev=k;try{localStorage.setItem("osa-ev",k)}catch(e){}}}
try{applyTheme(CFG.theme&&CFG.theme!=="auto"?CFG.theme:"");const k=localStorage.getItem("osa-ev");if(k&&(!CFG.theme||CFG.theme==="auto"))document.documentElement.dataset.ev=k}catch(e){}

/* ====== scorecards (tap a golfer) ====== */
const CARDS={};let CARD=null;
async function summary(id){const c=CARDS[id];if(c&&Date.now()-c.t<55000)return c.j;
  const r=await fetch(`https://site.web.api.espn.com/apis/site/v2/sports/golf/pga/leaderboard/${EVENT.id}/playersummary?player=${id}&_=${Date.now()}`,{cache:"no-store"});
  if(!r.ok)throw new Error("ESPN "+r.status);const j=await r.json();CARDS[id]={t:Date.now(),j};return j}
function openCard(key){const p=D.byKey[key];if(!p)return;CARD={key,round:null};drawCard();
  $("#sheet").classList.add("on");document.body.style.overflow="hidden";
  if(p.id&&EVENT.id)summary(p.id).then(j=>{if(CARD&&CARD.key===key){CARD.j=j;drawCard()}}).catch(()=>{if(CARD&&CARD.key===key){CARD.err=1;drawCard()}})}
function closeCard(){CARD=null;$("#sheet").classList.remove("on");document.body.style.overflow=""}
function drawCard(){if(!CARD)return;const p=D.byKey[CARD.key];if(!p)return closeCard();const o=ownerOf(p);
  const cut=p.status==="cut",v=cut?p.r[1]+p.r[2]-144:p.toPar;
  let h=`<div class="sc-head"><button class="x" data-close aria-label="Close">✕</button><h3>${esc(p.name)}</h3>
    <div class="meta">${o?tagHTML(o)+esc(o.name):"Unsold"}${lotLabel(p)?` · ${lotLabel(p).replace(/^#/,"RK #")}`:""}
    <span class="big">${p.status==="wd"?"WD":cut?"CUT":esc(p.pos)+"&nbsp;&nbsp;"+fmtPar(v)}</span></div></div>`;
  if(!p.id||!EVENT.id){$("#sheetCard").innerHTML=h+`<div class="empty">Scorecards come from ESPN and aren't available right now.</div>`;return}
  if(CARD.err){$("#sheetCard").innerHTML=h+`<div class="empty">Couldn't load the scorecard. Try again in a minute.</div>`;return}
  if(!CARD.j){$("#sheetCard").innerHTML=h+`<div class="empty">Loading scorecard…</div>`;return}
  const rounds=(CARD.j.rounds||[]).filter(r=>(r.linescores||[]).length).sort((a,b)=>a.period-b.period);
  const pars={};(CARD.j.rounds||[]).forEach(r=>(r.linescores||[]).forEach(x=>{if(x.par)pars[x.period]=x.par}));
  if(!rounds.length){$("#sheetCard").innerHTML=h+`<div class="empty">No holes played yet.</div>`;return}
  if(!CARD.round||!rounds.some(r=>r.period===CARD.round))CARD.round=rounds[rounds.length-1].period;
  const R=rounds.find(r=>r.period===CARD.round);const holes={};R.linescores.forEach(x=>holes[x.period]=x);
  const cell=n=>{const x=holes[n];if(!x||x.value==null)return"";const d=x.value-(x.par||pars[n]||0);
    const cls=!(x.par||pars[n])?"":d<=-2?"e":d===-1?"b":d===1?"g":d>=2?"d":"";return`<span class="hs ${cls}">${x.value}</span>`};
  const half=(a,lab)=>{const ns=[...Array(9)].map((_,i)=>a+i);const played=ns.filter(n=>holes[n]&&holes[n].value!=null);
    const ps=ns.reduce((t,n)=>t+(pars[n]||0),0),ss=played.reduce((t,n)=>t+holes[n].value,0);
    return`<table class="sct"><thead><tr><th style="text-align:left;padding-left:8px!important">Hole</th>${ns.map(n=>`<th>${n}</th>`).join("")}<th>${lab}</th></tr></thead><tbody>
      <tr class="par"><td class="lab">Par</td>${ns.map(n=>`<td>${pars[n]||""}</td>`).join("")}<td class="sum">${ps||""}</td></tr>
      <tr><td class="lab">Score</td>${ns.map(n=>`<td>${cell(n)}</td>`).join("")}<td class="sum">${played.length?ss:""}</td></tr></tbody></table>`};
  const played=R.linescores.filter(x=>x.value!=null).length;
  h+=`<div class="rtabs">${[1,2,3,4].map(k=>`<button data-round="${k}"${rounds.some(r=>r.period===k)?"":" disabled"} class="${k===CARD.round?"on":""}">R${k}</button>`).join("")}</div>
   <div class="scw">${half(1,"Out")}${half(10,"In")}
   <div class="legend"><span><i class="hs e"></i>Eagle</span><span><i class="hs b"></i>Birdie</span><span><i class="hs g"></i>Bogey</span><span><i class="hs d"></i>Double+</span></div>
   <div class="sc-foot"><span>Round ${CARD.round}${played<18?` · thru ${played}`:""}</span><span>${R.value?`<b>${played<18?"":R.value+" "}</b>`:""}${R.displayValue?`(${esc(R.displayValue)})`:""}</span></div></div>`;
  $("#sheetCard").innerHTML=h}
document.addEventListener("click",e=>{
  if(e.target.closest("[data-close]")){closeCard();return}
  const rb=e.target.closest("[data-round]");if(rb&&CARD&&!rb.disabled){CARD.round=+rb.dataset.round;drawCard();return}
  const row=e.target.closest("[data-p]");if(row&&!e.target.closest("[data-o]")){openCard(row.dataset.p)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCard()});


/* refresh right away when the app is reopened from the background */
let lastLoad=0;document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&Date.now()-lastLoad>15000)load()});
window.addEventListener("pageshow",e=>{if(e.persisted)load()});
function switchEvent(id){if(id===CUR.id)return;setEvent(id);STATE.ev=CUR.id;save();
  for(const k in GOOD)delete GOOD[k];for(const k in CARDS)delete CARDS[k];UPDATED=null;SOURCE="";STALE="";EVENT={name:"",id:""};CARD=null;closeCard();
  try{history.replaceState(null,"","?event="+CUR.id)}catch(e){}applyTheme(CUR.name);D=null;$("#view").innerHTML=`<div class="card"><div class="empty">Loading ${esc(CUR.name)}…</div></div>`;load()}
document.addEventListener("change",e=>{if(e.target.id==="evsel"){switchEvent(e.target.value);return}});
document.addEventListener("change",e=>{if(e.target.id!=="sel")return;STATE.sel=e.target.value||null;save();render()});
(()=>{let id=null;try{id=new URLSearchParams(location.search).get("event")}catch(e){}
  setEvent(id&&CFG.events.some(e=>e.id===id)?id:(STATE.ev&&CFG.events.some(e=>e.id===STATE.ev)?STATE.ev:CFG.events[0].id));applyTheme(CUR.name)})();
load();
setInterval(load,CFG.refreshSeconds*1000);
</script>
</body></html>
