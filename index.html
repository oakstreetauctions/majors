<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Oak Street">
<meta name="theme-color" content="#006747">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>Oak Street Auctions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@500;700&family=Libre+Franklin:ital,wght@0,500;0,700;1,500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ec;--card:#ffffff;--fg:#1c2a21;--mut:#6d7468;--line:#e6e2d4;--row:#faf9f4;
  --green:#006747;--deep:#00543a;--gold:#f2c94c;--under:#c8102e;--over:#006747;--pos:#006747;--neg:#c8102e;
  --hdr:#006747;--hdrfg:#ffffff;--th:#006747;--thfg:#ffffff;--shadow:0 1px 2px rgba(28,42,33,.06),0 4px 14px rgba(28,42,33,.04);
  --serif:"Libre Caslon Text",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b120e;--card:#131c17;--fg:#eef1ea;--mut:#9aa396;--line:#253029;--row:#17211b;
  --green:#4fb98a;--deep:#003a28;--under:#ff6b6b;--over:#5fca98;--pos:#5fca98;--neg:#ff7a72;--hdr:#00422d;--th:#0a4a34;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#0b120e;--card:#131c17;--fg:#eef1ea;--mut:#9aa396;--line:#253029;--row:#17211b;
  --green:#4fb98a;--deep:#003a28;--under:#ff6b6b;--over:#5fca98;--pos:#5fca98;--neg:#ff7a72;--hdr:#00422d;--th:#0a4a34;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
header{background:var(--hdr);color:var(--hdrfg);padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 14px;text-align:center}
header h1{margin:0;font:400 27px/1.1 var(--serif);letter-spacing:.06em}
header .rule{width:44px;height:1px;background:var(--gold);margin:10px auto 0;opacity:.9}
nav{position:sticky;top:0;z-index:5;background:var(--hdr);display:flex;padding:0 8px;justify-content:center;border-bottom:1px solid rgba(255,255,255,.08);box-shadow:0 2px 8px rgba(0,0,0,.08)}
nav button{flex:1 1 0;max-width:160px;appearance:none;border:0;background:none;color:rgba(255,255,255,.66);font:600 11.5px Inter,sans-serif;letter-spacing:.11em;text-transform:uppercase;padding:13px 2px 11px;border-bottom:2px solid transparent;cursor:pointer;transition:color .15s}
nav button:hover{color:#fff}
nav button.on{color:#fff;border-bottom-color:var(--gold)}
.wrap{max-width:760px;margin:0 auto;padding:16px 12px calc(36px + env(safe-area-inset-bottom,0px))}
.status{display:flex;align-items:center;gap:12px;justify-content:center;font:italic 400 14px var(--serif);color:var(--green);margin:2px 0 14px}
.status::before,.status::after{content:"";height:1px;width:38px;background:var(--gold)}
.status b{font-weight:400}
.status{flex-wrap:wrap}.stale{flex-basis:100%;text-align:center;font:500 11px Inter,sans-serif;font-style:normal;color:var(--mut);margin-top:-2px}
.status .stale{order:3}
.pick{position:relative;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:0 12px;height:46px;margin:0 0 14px;box-shadow:var(--shadow)}
.pick .lbl{font:600 10px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);flex:0 0 auto}
.pick .sw{width:12px;height:12px;border-radius:3px;flex:0 0 auto;border:1px solid var(--line)}
.pick .val{flex:1;min-width:0;font:600 14px Inter,sans-serif;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .car2{color:var(--green);font-size:11px;flex:0 0 auto}
.pick select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.tag{display:inline-flex;align-items:center;justify-content:center;min-width:32px;flex:0 0 auto;height:20px;padding:0 5px;border-radius:3px;font:700 10.5px Inter,sans-serif;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow)}
.sec{font:400 15px var(--serif);color:var(--green);padding:12px 12px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.sec span:last-child:not(:first-child){font:600 10.5px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.lb .r{display:grid;grid-template-columns:30px 3px minmax(0,1fr) 36px 44px 30px;align-items:center;gap:6px;padding:9px 10px 9px 10px;border-bottom:1px solid var(--line)}
.lb .r:last-child{border-bottom:0}
.lb .r:not(.h):nth-child(odd){background:var(--row)}
.lb .h,th,.lot.h{background:var(--th)!important;color:var(--thfg)!important;font:600 10.5px Inter,sans-serif!important;letter-spacing:.12em!important;text-transform:uppercase;border-bottom:0!important}
.lb .h{padding-top:9px;padding-bottom:9px;letter-spacing:.04em!important;font-size:9.5px!important}
.bar{width:3px;height:32px;border-radius:2px;background:transparent}
.pos{font:600 14px Inter,sans-serif;color:var(--fg);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pos .t{font-size:10px;font-weight:600;color:var(--mut);margin-right:1px;vertical-align:1px}
.nm{min-width:0}
.nm b{display:flex;align-items:baseline;font-weight:600;font-size:14px;letter-spacing:-.005em;min-width:0}
.nm b .n1{min-width:0;line-height:1.2;overflow-wrap:anywhere}
.lc{text-align:center;font:italic 400 12.5px var(--serif);color:var(--mut);line-height:1.1}
.nm small{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:11px;letter-spacing:.03em;margin-top:3px;white-space:nowrap;overflow:hidden}
.nm small .tag{height:16px;min-width:28px;font-size:9.5px}
.sc{text-align:right;font-weight:700;font-size:15.5px;font-variant-numeric:tabular-nums}
.under{color:var(--under)}.over{color:var(--over)}
.th{text-align:center;color:var(--mut);font-size:12px}
.mo{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:12.5px}
.mo:empty::after{content:"–";color:var(--line)}
.dim{opacity:.25}
.me td{background:rgba(242,201,76,.16)!important}
.selbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:4px;padding:10px 12px;margin:0 0 14px;box-shadow:var(--shadow)}
.selbar .who2{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.selbar .nums{font-size:12px;color:var(--mut);margin-top:3px;font-variant-numeric:tabular-nums}
.selbar .nums b{color:var(--fg);font-weight:600}
.selbar .nums b.posv{color:var(--pos)}.selbar .nums b.negv{color:var(--neg)}
.selbar button{appearance:none;border:1px solid var(--green);background:none;color:var(--green);border-radius:999px;padding:6px 12px;font:600 10.5px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.empty{padding:22px 12px;text-align:center;font:italic 400 14px var(--serif);color:var(--mut)}
.cutrow .nm b{font-weight:500;color:var(--mut)}
.cutrow .sc{font-weight:500;font-size:14px}
.rk{flex:0 0 auto;font:italic 400 12px var(--serif);color:var(--mut);margin-left:5px;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:right;padding:9px 10px}
th:first-child,td:first-child{text-align:left}
td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right}
tbody tr:nth-child(even) td{background:var(--row)}
tr:last-child td{border-bottom:0}
.who{display:flex;align-items:center;gap:9px;font-weight:600}
.posv{color:var(--pos)}.negv{color:var(--neg)}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.lot{display:grid;grid-template-columns:1fr 44px 52px 54px;gap:6px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}
.lot .ln{display:flex;align-items:center;gap:8px;min-width:0}
.lnm{display:flex;align-items:baseline;min-width:0;font-weight:600;font-size:13.5px}
.lnm .n1{min-width:0;line-height:1.2;overflow-wrap:anywhere}
.lot.rkd{grid-template-columns:34px minmax(0,1fr) 44px 52px 54px}
.lr{font:italic 400 13px var(--serif);color:var(--mut)}
.lot.h span{font-size:10px!important}
.lot .n{font-size:13px}
.lot .n{text-align:right;font-variant-numeric:tabular-nums}
.lot.h{padding:9px 10px}
details[open]>summary .car{transform:rotate(90deg)}
.car{display:inline-block;color:var(--green);transition:transform .15s;font-size:9px;width:10px}
.sub{background:var(--row);border-bottom:1px solid var(--line);padding:4px 10px 6px 28px}
.sub div{display:grid;grid-template-columns:1fr 46px 40px 56px;gap:8px;padding:5px 0;font-size:13px;border-bottom:1px dotted var(--line)}
.sub div:last-child{border-bottom:0}
.sub div span:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font:600 9.5px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;border-radius:2px;border:1px solid var(--line);color:var(--mut);margin-top:5px}
.badge.final{background:var(--green);border-color:var(--green);color:#fff}
.pay td{vertical-align:top}
.pay td b{font-weight:600}
.pay .holders{display:flex;flex-direction:column;gap:5px;align-items:flex-start;text-align:left}
.pay .holders div{display:flex;gap:7px;align-items:center;font-size:13px}
.pot{display:flex;flex-direction:column;align-items:center;padding:18px 12px 16px;gap:2px}
.pot span:first-child{font:600 10.5px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.pot span:last-child{font:400 32px/1.1 var(--serif);color:var(--green)}
.note{font:italic 400 12.5px var(--serif);color:var(--mut);padding:0 4px 12px;text-align:center}
.err{background:#fff3cd;color:#664d03;border:1px solid #ffe08a;border-radius:4px;padding:8px 10px;margin-bottom:10px;font-size:12px}
footer{text-align:center;font:italic 400 12px var(--serif);color:var(--mut);padding:4px 0 0}
@media (max-width:380px){.lb .r{grid-template-columns:26px 3px minmax(0,1fr) 34px 40px 26px;gap:5px}nav button{letter-spacing:.08em;font-size:11px}}

/* ===== per-major themes (set automatically from the ESPN event name) ===== */
html[data-ev="pga"]{--hdr:#00205B;--th:#00205B;--green:#00205B;--over:#00205B;--gold:#C9A961;--serif:"Cinzel",Georgia,serif}
html[data-ev="usopen"]{--hdr:#00365F;--th:#00365F;--green:#00365F;--over:#00365F;--gold:#BF0D3E;--serif:"Libre Franklin",Inter,sans-serif}
html[data-ev="open"]{--hdr:#FFD100;--hdrfg:#0B2545;--th:#FFD100;--thfg:#0B2545;--green:#0B2545;--over:#0B2545;--gold:#0B2545;--serif:"Cormorant Garamond",Georgia,serif}
html[data-ev="fedex"]{--hdr:#4D148C;--th:#4D148C;--green:#4D148C;--over:#4D148C;--gold:#FF6200;--serif:"Montserrat",Inter,sans-serif}
@media (prefers-color-scheme:dark){
  html[data-ev="pga"]:not([data-theme="light"]){--hdr:#0d1d44;--th:#132a5e;--green:#9db7ff;--over:#9db7ff}
  html[data-ev="usopen"]:not([data-theme="light"]){--hdr:#062a47;--th:#0b3a63;--green:#8cc2f0;--over:#8cc2f0}
  html[data-ev="open"]:not([data-theme="light"]){--hdr:#E8BE00;--th:#E8BE00;--green:#ffd75a;--over:#9fbbe0;--gold:#ffd75a}
  html[data-ev="fedex"]:not([data-theme="light"]){--hdr:#2e0b57;--th:#45177d;--green:#c9a3ff;--over:#c9a3ff}}
html[data-ev="pga"] header h1{text-transform:uppercase;letter-spacing:.12em;font-size:23px}
html[data-ev="usopen"] header h1{font-weight:700;letter-spacing:.02em;text-transform:uppercase;font-size:24px}
html[data-ev="open"] header h1{font-weight:600;font-size:30px}
/* The Open: yellow bar with navy lettering (the reverse of the navy majors) */
html[data-ev="open"] header .rule{background:#0B2545}
html[data-ev="open"] nav{border-bottom-color:rgba(11,37,69,.15)}
html[data-ev="open"] nav button{color:rgba(11,37,69,.6)}
html[data-ev="open"] nav button:hover,html[data-ev="open"] nav button.on{color:#0B2545}
html[data-ev="open"] nav button.on{border-bottom-color:#0B2545}
html[data-ev="open"] .evpick{border-color:rgba(11,37,69,.4);color:#0B2545}
@media (prefers-color-scheme:dark){html[data-ev="open"]:not([data-theme="light"]) .rpill{color:#0B2545}}
html[data-ev="fedex"] header h1{font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:22px}
/* ===== movement arrows ===== */
.pos{display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1.1}
.lb .h span:first-child{text-align:center}
.mvc{text-align:right}
.mv{font:600 10.5px Inter,sans-serif;font-style:normal;letter-spacing:.01em;white-space:nowrap}
.mv.up{color:var(--pos)}.mv.dn{color:var(--neg)}
.lb .r[data-p]{cursor:pointer}
.lb .r[data-p]:active{filter:brightness(.97)}
/* ===== scorecard sheet ===== */
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.on{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(10,20,14,.45);animation:fade .15s}
.sheet-card{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--bg);border-radius:14px 14px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.25);animation:up .2s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:640px){.sheet-card{left:50%;right:auto;width:600px;transform:translateX(-50%);bottom:auto;top:8vh;border-radius:8px;animation:fade .15s}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sc-head{background:var(--hdr);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:1}
.sc-head h3{margin:0;font:400 21px/1.15 var(--serif);padding-right:36px}
.sc-head .meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:rgba(255,255,255,.8);flex-wrap:wrap}
.sc-head .x{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:none;color:#fff;font-size:16px;cursor:pointer}
.sc-head .big{margin-left:auto;font:700 18px Inter,sans-serif}
.rtabs{display:flex;gap:6px;padding:12px 16px 4px}
.rtabs button{flex:1;appearance:none;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:4px;padding:8px 0;font:600 11px Inter,sans-serif;letter-spacing:.1em;cursor:pointer}
.rtabs button.on{background:var(--green);border-color:var(--green);color:#fff}
.rtabs button:disabled{opacity:.35;cursor:default}
.scw{padding:8px 12px 16px}
.sct{width:100%;border-collapse:collapse;table-layout:fixed;background:var(--card);border:1px solid var(--line);margin-bottom:10px;font-variant-numeric:tabular-nums}
.sct th,.sct td{padding:6px 0!important;text-align:center!important;font-size:12.5px;border-bottom:1px solid var(--line)}
.sct th{font-size:10px!important;letter-spacing:.04em!important}
.sct td.lab,.sct th:first-child{font:600 9px Inter,sans-serif!important;letter-spacing:.06em!important;text-transform:uppercase;text-align:left!important;padding-left:7px!important;width:50px}
.sct td.lab{color:var(--mut)}
.sct td.sum{font-weight:700;background:var(--row)}
.sct tr.par td{color:var(--mut)}
.hs{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;font-weight:600;box-sizing:border-box}
.hs.b{border:1.5px solid var(--under);border-radius:50%;color:var(--under)}
.hs.e{border:1.5px solid var(--under);border-radius:50%;color:var(--under);box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--under)}
.hs.g{border:1.5px solid var(--over);color:var(--over)}
.hs.d{border:1.5px solid var(--over);color:var(--over);box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--over)}
.sc-foot{display:flex;justify-content:space-between;padding:4px 4px 0;font-size:12px;color:var(--mut)}
.sc-foot b{color:var(--fg)}
.legend{display:flex;gap:12px;justify-content:center;font-size:11px;color:var(--mut);padding:2px 0 4px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .hs{width:15px;height:15px;font-size:0}
.tag.lite,.bar.lite{box-shadow:inset 0 0 0 1px rgba(0,0,0,.22)}
.lb .r>:nth-child(5){padding-right:6px}

/* ===== leaderboard, PGA Tour style ===== */
.plb{border-radius:4px}
.pr{display:grid;grid-template-columns:24px 34px minmax(0,1fr) 30px 34px 38px 30px;align-items:center;gap:6px;padding:0 10px;min-height:46px;border-bottom:1px solid var(--line);background:var(--card);cursor:pointer}
.pr:last-child{border-bottom:0}
.pr:active{background:var(--row)}
.pr.ph{min-height:0;padding-top:12px;padding-bottom:8px;border-bottom:2px solid var(--fg);cursor:default;font:600 10.5px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.pr.ph .c{text-align:center}
.rpill{display:inline-block;background:var(--green);color:#fff;border-radius:3px;padding:3px 6px;font-weight:700;letter-spacing:.04em}
.ppos{font:700 14.5px Inter,sans-serif;color:var(--fg);font-variant-numeric:tabular-nums}
.ptag{display:flex;align-items:center}
.ptag .tag{min-width:30px;height:19px;font-size:10px}
.nob{color:var(--line);padding-left:10px}
.pname{font:600 14.5px Inter,sans-serif;color:var(--fg);letter-spacing:-.005em;line-height:1.2;overflow-wrap:anywhere;padding:6px 0}
.prk{text-align:center;font:italic 400 12.5px var(--serif);color:var(--mut)}
.ptot,.prd{text-align:center;font:700 14.5px Inter,sans-serif;font-variant-numeric:tabular-nums;color:var(--fg)}
.prd{font-weight:500}
.pthru{text-align:center;font:600 13.5px Inter,sans-serif;color:var(--fg);white-space:nowrap}
.pthru.tt{font:500 11px Inter,sans-serif;letter-spacing:-.03em;color:var(--mut)}
.red{color:var(--under)!important}
.pr.cut .pname,.pr.cut .ptot{color:var(--mut);font-weight:500}
.pr.cut .pthru{font-size:10.5px;letter-spacing:.06em;color:var(--mut)}
@media (max-width:380px){.pr{grid-template-columns:20px 31px minmax(0,1fr) 27px 31px 36px 27px;gap:5px;padding:0 8px}.pname{font-size:14px}}


/* ===== long holder lists (Make Cut) ===== */
details.many summary{list-style:none;cursor:pointer;font-weight:600;color:var(--mut)}
details.many summary::-webkit-details-marker{display:none}
details.many summary .car{font-size:9px;display:inline-block;transition:transform .15s}
details.many[open] summary .car{transform:rotate(90deg)}
details.many .holders{margin-top:6px}
details.many .mc-tot{display:block}
details.many .mc-counts{display:flex;flex-direction:column;gap:5px;margin-top:6px}
details.many .mc-c{display:grid;grid-template-columns:auto 52px auto;align-items:center;gap:8px;color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
details.many .mc-c .tag{justify-self:start}
details.many .mc-n{color:var(--mut)}
details.many .mc-n b{color:var(--fg)}
details.many .mc-amt{font-weight:700}
details.many[open] .mc-counts{display:none}

/* ===== menu (hamburger) ===== */
header{position:relative;padding-left:48px!important;padding-right:48px!important}
@media (max-width:460px){html header h1{font-size:clamp(17px,5.4vw,23px)!important;letter-spacing:.04em!important;white-space:nowrap}}
.burger{position:absolute;left:10px;top:calc(env(safe-area-inset-top,0px) + 14px);width:40px;height:40px;border:0;background:none;color:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:6px}
.burger:hover{background:rgba(255,255,255,.1)}
.burger svg{width:22px;height:22px}
html[data-ev="open"] .burger:hover{background:rgba(11,37,69,.08)}
.drawer{position:fixed;inset:0;z-index:60;display:none}
.drawer.on{display:block}
.drawer-bg{position:absolute;inset:0;background:rgba(10,20,14,.45);animation:fade .15s}

/* ====== SETTINGS ======
   For each tab: File > Share > Publish to web > pick the tab > Comma-separated values (.csv) > Publish.
   Paste the link between the quotes. Leave a slot blank to use the sample data for that tab. */
const CFG = {
  // ===== EVENTS =====  Newest first. The first one is what the site opens to.
  // espnEvent = the number after tournamentId= in the ESPN leaderboard link.
  // short     = optional shorter name for the event dropdown list (the header shows the full name).
  // makeCutPerGolfer = true if that year's sheet rounded each golfer's Make Cut share to the cent
  // roundHalfUp = true if that event's sheet rounded each golfer's share with half a cent going up (2024 playoffs)
  // roundByBidder = true if that event's sheet added up each bidder's exact winnings and rounded once (2022 BMW)
  //             (normally each bidder gets pool x their golfers / all golfers, rounded once).
  // makeCutWD = false if a golfer who withdraws after making the cut did NOT get a Make Cut share that year.
  // espnDate  = if espnEvent is blank, the site finds the event on ESPN from its final-round date (YYYYMMDD).
  // sheets    = published CSV links for that event's tabs (leave blank for past events;
  //             their auction data is saved inside this file).

function recRow(label,who,val,detail,o){return`<div class="rec"><div class="rl">${label}</div><div class="rw">${o?tagHTML(o):""}<span>${who}</span></div><div class="rv">${val}</div>${detail?`<div class="rd">${detail}</div>`:""}</div>`}
function recordsHTML(evs){const B=bidders(evs);const lots=evs.flatMap(x=>x.lots);const O=n=>ALL.look[n];
  const pot=evs.reduce((t,x)=>t+x.pot,0);const all=[];for(const b of B)for(const v of b.evs)all.push({b,...v});
  // every entry tied for the top value (compared at the precision shown)
  const tops=(arr,f)=>{if(!arr.length)return[];const v=arr.map(f),m=Math.max(...v);return arr.filter((_,k)=>v[k]===m)};
  const D$=x=>Math.round(x),X=x=>Math.round(x*10)/10;
  const hiEv=tops(all,v=>D$(v.net)),loEv=tops(all,v=>-D$(v.net)),bigPot=tops(evs,x=>D$(x.pot)),smPot=tops(evs,x=>-D$(x.pot));
  const bestLot=tops(lots,l=>D$(l.won-l.price)),bestX=tops(lots.filter(l=>l.price>=1&&l.won>0),l=>Math.round(l.won/l.price)),dear=tops(lots,l=>D$(l.price));
  const bust=tops(lots.filter(l=>l.won===0),l=>D$(l.price));
  const champs=evs.filter(x=>x.champLot);const cheap=tops(champs,x=>-D$(x.champLot.price)),pricey=tops(champs,x=>D$(x.champLot.price));
  const titles=B.filter(b=>b.titles).sort((a,b)=>b.titles-a.titles||b.net-a.net);
  const roiQ=B.filter(b=>b.evs.length>=Math.min(5,evs.length)&&b.paid>0);const bestRoi=tops(roiQ,b=>Math.round(b.roi*100)),mostEv=tops(B,b=>b.evs.length);
  // one record, with a line for each tied entry
  const rec=(label,list,f)=>{if(!list.length)return"";const rows=list.map(f);
    return`<div class="rec"><div class="rl">${label}${list.length>1?` <span style="text-transform:none;letter-spacing:0">· ${list.length}-way tie</span>`:""}</div>${rows.map(([who,val,det,o])=>`<div class="rw">${o?tagHTML(o):""}<span>${who}</span></div><div class="rv">${val}</div>${det?`<div class="rd">${det}</div>`:""}`).join("")}</div>`};
  const bigP=bigPot[0],chm=tops(champs,x=>D$(x.champLot.price));
  let h=`<div class="tiles">
    <div class="tile"><div class="k">Events</div><div class="v">${evs.length}</div><div class="s">${new Set(evs.map(x=>x.yr)).size} season${new Set(evs.map(x=>x.yr)).size===1?"":"s"}</div></div>
    <div class="tile"><div class="k">Total pots</div><div class="v">${money(pot)}</div><div class="s">avg ${money(pot/evs.length)} per event</div></div>
    <div class="tile"><div class="k">Bidders</div><div class="v">${B.length}</div><div class="s">${(all.length/evs.length).toFixed(1)} per event</div></div>
    <div class="tile"><div class="k">Biggest pot</div><div class="v">${money(bigP.pot)}</div><div class="s">${bigPot.map(x=>esc(evLabel(x.e))).join(", ")}</div></div></div>`;
  h+=`<div class="card"><div class="sec"><span>Records</span><span>${STATE.fmaj&&STATE.fmaj!=="all"||STATE.fyr&&STATE.fyr!=="all"?"filtered":"all-time"}</span></div>
    ${rec("Best single event",hiEv,v=>[esc(v.b.name),sgn(v.net),esc(evLabel(v.x.e))+` · paid ${money(v.paid)}, won ${money(v.won)}`,v.b.o])}
    ${rec("Worst single event",loEv,v=>[esc(v.b.name),sgn(v.net),esc(evLabel(v.x.e))+` · paid ${money(v.paid)}, won ${money(v.won)}`,v.b.o])}
    ${rec("Biggest profit on one lot",bestLot,l=>[esc(l.lot),sgn(l.won-l.price),`${money(l.price)} → ${money(l.won)} · ${esc(evLabel(l.ev))}`,O(l.owner)])}
    ${rec("Best return per dollar",bestX,l=>[esc(l.lot),Math.round(l.won/l.price)+"×",`${money(l.price)} → ${money(l.won)} · ${esc(evLabel(l.ev))}`,O(l.owner)])}
    ${rec("Priciest lot",dear,l=>[esc(l.lot),money(l.price),`won ${money(l.won)} · ${esc(evLabel(l.ev))}`,O(l.owner)])}
    ${rec("Priciest bust",bust,l=>[esc(l.lot),money(l.price),`won nothing · ${esc(evLabel(l.ev))}`,O(l.owner)])}
    ${rec("Cheapest champion",cheap,x=>[esc(x.champ.name),money(x.champLot.price),`${esc(evLabel(x.e))}${x.champLot.players.length>1?` · ${esc(x.champLot.lot)}`:""}`,O(x.champOwner)])}
    ${champs.length>1&&D$(pricey[0].champLot.price)!==D$(cheap[0].champLot.price)?rec("Priciest champion",pricey,x=>[esc(x.champ.name),money(x.champLot.price),esc(evLabel(x.e)),O(x.champOwner)]):""}
    ${rec(`Best ROI${evs.length>=5?" (5+ events)":""}`,bestRoi,b=>[esc(b.name),pct(b.roi),`${money(b.paid)} paid · ${money(b.won)} won over ${b.evs.length} events`,b.o])}
    ${(()=>{const L=loyalty(evs).filter(r=>r.c>=2);if(!L.length)return"";const t=tops(tops(L,r=>r.c),r=>Math.round(r.share*100));
      return rec("Most loyal buyer",t,r=>[`${r.who.map(esc).join(" & ")} <small style="font-weight:500;color:var(--mut)">· ${esc(r.name)}</small>`,`${r.c} of ${r.n}`,`bought ${esc(r.name)} ${r.c} of the ${r.n} times he was auctioned${r.grp?` (${r.grp} in a group)`:""}`,ALL.look[r.who[0]]])})()}
    ${mostEv.length===B.length?"":rec("Most events",mostEv,b=>[esc(b.name),b.evs.length,`${money(b.paid)} paid`,b.o])}
    ${rec("Biggest pot",bigPot,x=>[esc(evLabel(x.e)),money(x.pot),"",null])}
    ${evs.length>1&&D$(smPot[0].pot)!==D$(bigP.pot)?rec("Smallest pot",smPot,x=>[esc(evLabel(x.e)),money(x.pot),"",null]):""}

  if(titles.length)h+=`<div class="card"><div class="sec"><span>Most champions owned</span><span>🏆</span></div>${titles.map(b=>recRow("",esc(b.name),"🏆".repeat(Math.min(b.titles,6))+(b.titles>6?" "+b.titles:""),evs.filter(x=>x.champOwner===b.name).map(x=>`${esc(x.champ.name)} (${esc(evAbbr(x.e))})`).join(", "),b.o)).join("")}</div>`;
  h+=`<div class="card"><div class="sec"><span>Champions</span><span>${champs.length}</span></div><table class="at"><thead><tr><th>Event</th><th>Owner</th><th>Paid</th><th>Won</th></tr></thead><tbody>`;
  for(const x of champs.slice().sort((a,b)=>a.ord-b.ord)){const o=O(x.champOwner);
    h+=`<tr data-goev="${esc(x.e.id)}" style="cursor:pointer"><td><b style="font-weight:600">${esc(x.champ.name)}</b><span style="display:block;font:500 11px Inter,sans-serif;color:var(--mut)">${esc(evLabel(x.e))}${x.champLot.players.length>1?" · "+esc(x.champLot.lot):""}</span></td><td>${o?tagHTML(o):"–"}</td><td>${money(x.champLot.price)}</td><td>${money(x.champLot.won)}</td></tr>`}
  return h+`</tbody></table></div><div class="note">"Won" is everything the champion's lot paid out that week. Tap a row to open the event.</div>`}


/* who keeps buying the same golfer: individual lots only */
function loyalty(evs){const G={};
  for(const x of evs)for(const l of x.lots){if(l.kind==="field")continue;
    for(const nm of l.kind==="ind"?[l.lot]:l.players.map(p=>typeof p==="string"?p:p.name)){const g=G[nm]||(G[nm]={name:nm,n:0,by:{},grp:{}});
      g.n++;g.by[l.owner]=(g.by[l.owner]||0)+1;if(l.kind==="group")g.grp[l.owner]=(g.grp[l.owner]||0)+1}}
  const out=[];for(const g of Object.values(G)){const m=Math.max(...Object.values(g.by));
    const who=Object.keys(g.by).filter(k=>g.by[k]===m).sort();out.push({name:g.name,n:g.n,c:m,who,share:m/g.n,grp:who.length===1?g.grp[who[0]]||0:0})}
  return out.sort((a,b)=>b.c-a.c||b.share-a.share||b.n-a.n||a.name.localeCompare(b.name))}
function loyalRow(r){const o=ALL.look[r.who[0]];
  return`<div class="hb" data-gg="${esc(r.name)}" data-gb="${esc(r.who[0])}"><div class="top"><span style="display:flex;align-items:center;gap:8px;min-width:0">${r.who.map(w=>tagHTML(ALL.look[w])).join("")}<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</span></span><span style="white-space:nowrap">${r.c} of ${r.n} <small>· ${Math.round(r.share*100)}%</small></span></div>
    <div class="track" style="height:6px"><div class="fill" style="left:0;width:${r.share*100}%;background:${o?o.color:"var(--green)"}"></div></div>
    <div style="font:500 11.5px Inter,sans-serif;color:var(--mut);margin-top:5px">${r.who.map(esc).join(" & ")}${r.who.length>1?" (each)":""}${r.grp?` · ${r.grp===r.c?"all":r.grp} in groups`:""}</div></div>`}
function analyticsHTML(evs){const lots=evs.flatMap(x=>x.lots);
  const tiers=[["OWGR 1–5",l=>l.kind==="ind"&&l.rank&&l.rank<=5],["OWGR 6–10",l=>l.kind==="ind"&&l.rank>5&&l.rank<=10],["OWGR 11–25",l=>l.kind==="ind"&&l.rank>10&&l.rank<=25],
    ["OWGR 26–50",l=>l.kind==="ind"&&l.rank>25],["Groups (5 golfers)",l=>l.kind==="group"],["The Field",l=>l.kind==="field"]];
  const rows=tiers.map(([n,f])=>{const ls=lots.filter(f);const paid=ls.reduce((t,l)=>t+l.price,0),won=ls.reduce((t,l)=>t+l.won,0);
    return{n,ls,paid,won,roi:paid?won/paid-1:0,cash:ls.filter(l=>l.won>0).length}}).filter(r=>r.ls.length);
  const mx=Math.max(.5,...rows.map(r=>Math.abs(r.roi)));
  const LY=loyalty(evs).filter(r=>r.c>=2);
  let h=LY.length?`<div class="card"><div class="sec"><span>Go-to golfers</span><span>times bought</span></div>${LY.slice(0,12).map(loyalRow).join("")}<div class="note" style="margin:0;padding:10px 12px">Counts golfers bought on their own or in a group. The Field doesn’t count.</div></div>`:"";
  h+=`<div class="card"><div class="sec"><span>Return by price tier</span><span>ROI</span></div>${rows.map(r=>{const w=Math.min(Math.abs(r.roi)/mx,1)*50;
    return`<div class="hb" title="${esc(r.n)}: ${money(r.paid)} paid, ${money(r.won)} won"><div class="top"><span>${esc(r.n)} <small>· ${r.cash} of ${r.ls.length} lots cashed</small></span><span class="${r.roi>0?"posv":r.roi<0?"negv":""}">${pct(r.roi)}</span></div>
      <div class="track"><div class="mid" style="left:50%"></div><div class="fill ${r.roi>=0?"p":"n"}" style="${r.roi>=0?`left:50%;width:${w}%`:`right:50%;width:${w}%`}"></div></div>
      <div class="top" style="margin:6px 0 0"><small>${money(r.paid)} paid</small><small>${money(r.won)} won</small></div></div>`}).join("")}</div>
  <div class="note" style="margin-top:-8px;margin-bottom:16px">Every dollar bid comes back as winnings, so the tiers balance out to zero overall. Positive tiers have paid back more than they cost.</div>`;
  // average price paid by OWGR rank band
  const ind=lots.filter(l=>l.kind==="ind"&&l.rank);const bands=[[1,1],[2,3],[4,5],[6,10],[11,15],[16,25],[26,35],[36,50]];

    if(out.length)h+=`<div class="card lvb"><div class="sec"><span>Missed cut / withdrawn</span><span>${out.length}</span></div>${out.map(p=>liveRow(p,true)).join("")}</div>`}
  else{const G={};for(const p of L.players){if(!p.tee||p.out)continue;const key=p.tee.getTime()+"|"+p.hole;(G[key]||(G[key]={t:p.tee,hole:p.hole,ps:[]})).ps.push(p)}
    const gs=Object.values(G).sort((a,b)=>a.t-b.t||a.hole-b.hole);
    if(!gs.length)h+=`<div class="card"><div class="empty">${L.final?"The tournament is over.":"Tee times usually post Tuesday."}</div></div>`;
    else{let day="";h+=`<div class="card">`;
      for(const g of gs){const dl=g.t.toLocaleDateString([],{weekday:"long",month:"short",day:"numeric"});
        if(dl!==day){day=dl;h+=`<div class="sec"><span>${esc(dl)}</span><span>Round ${L.round}${L.started&&L.state!=="in"&&g.t>Date.now()?"":""}</span></div>`}
        h+=`<div class="tt"><div class="tm"><b>${liveTee(g.t)}</b><small>${g.hole===10?"Hole 10":"Hole 1"}</small></div><div class="tp">${g.ps.map(p=>`<div><span>${esc(p.name)}${p.am?' <small>(a)</small>':""}</span><span class="${toPar(p.score)<0?"red":""}">${esc(p.score||"")}</span></div>`).join("")}</div></div>`}
      h+=`</div><div class="note">Times shown in your time zone.</div>`}}
  h+=`<div class="note">${L.err?"Couldn't reach ESPN — showing the last update. ":""}Updated ${new Date(LIVE_AT).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})} · refreshes every minute</div>`;
  if(cfg)h+=`<button class="feat" data-goev="${esc(cfg.id)}" style="margin-top:4px"><div class="body"><div class="ev" style="font-size:18px">Calcutta: payouts & standings</div><div class="ch"><span>See who owns who and what everyone's winning</span></div><div class="go">Open →</div></div></button>`;
  return h}
function liveRow(p,showPos){const v=toPar(p.score),tv=toPar(p.today),mv=+p.move||0;
  return`<div class="lvr${p.out?" out":""}"><span class="ps">${showPos?esc(p.out?p.pos:p.pos):""}</span><span class="nm">${esc(p.name)}${p.am?' <small>(a)</small>':""}${mv&&!p.out?`<i class="${mv>0?"up":"dn"}">${mv>0?"▲":"▼"}${Math.abs(mv)}</i>`:""}</span>
    <span class="${v!=null&&v<0&&!p.out?"red":""}">${p.out?"":esc(p.score||"")}</span><span class="th${/:/.test(p.thru)?" tt2":""}">${esc(p.out?"":p.thru||"")}</span><span class="${tv!=null&&tv<0?"red":""}">${esc(p.out?"":p.today||"")}</span></div>`}
document.addEventListener("click",e=>{const t=e.target.closest("[data-ltab]");if(!t)return;STATE.ltab=t.dataset.ltab;save();renderOther()});
setInterval(()=>{if((STATE.page||"event")==="home"&&document.visibilityState==="visible")loadLive()},60000);

/* ---- menu ---- */
function drawDrawer(){computeAll();const page=STATE.page||"event";const byId={};ALL.events.forEach(x=>byId[x.e.id]=x);
  const yrs=[...new Set(CFG.events.map(yrOf))].sort((a,b)=>b-a);
  let h=`<div class="dr-head"><b>Oak Street Auctions</b><button data-dclose aria-label="Close menu">✕</button></div>
    <button class="dr-link${page==="home"?" on":""}" data-page="home" style="margin-top:8px"><span class="ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7M5 10v10h14V10"/></svg></span>Home</button>
    <button class="dr-link${page==="alltime"?" on":""}" data-page="alltime"><span class="ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 6h3v2a3 3 0 0 1-3 3M7 6H4v2a3 3 0 0 0 3 3"/></svg></span>All-Time Standings</button>
    <button class="dr-link${page==="stats"?" on":""}" data-page="stats"><span class="ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>Stats & Records</button>
    <button class="dr-link${page==="golfers"?" on":""}" data-page="golfers"><span class="ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V3l11 4-11 4"/><path d="M3 21h10"/></svg></span>Golfers</button>
    <button class="dr-link${page==="event"?" on":""}" data-devt aria-expanded="${STATE.devt?"true":"false"}"><span class="ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>Events<span class="dr-car${STATE.devt?" open":""}">▾</span></button>`;
  const grid=(MK,label)=>{const ys=[...new Set(CFG.events.filter(e=>MK.includes(majOf(e))).map(yrOf))].sort((a,b)=>b-a);if(!ys.length)return"";
    let g=label?`<div class="dr-div"><span>${label}</span></div>`:"";
    g+=`<div class="dr-grid" style="grid-template-columns:44px repeat(${MK.length},minmax(0,1fr))">`;
    for(const y of ys){g+=`<span class="dr-y">${y}</span>`;
      for(const k of MK){const e=CFG.events.find(e=>yrOf(e)===y&&majOf(e)===k);
        if(!e||!hasData(e)){g+=`<span class="dr-cell off">—</span>`;continue}
        const live=!byId[e.id];
        g+=`<button class="dr-cell${page==="event"&&e.id===CUR.id?" on":""}" data-goev="${esc(e.id)}" aria-label="${esc(e.name)}" style="--mc:${MAJ[k].c}">${live?"LIVE":MAJ[k].a}</button>`}}
    return g+`</div>`};
  const hasPO=CFG.events.some(e=>PO.includes(majOf(e)));
  h+=`<div class="dr-evs"${STATE.devt?"":" hidden"}>${grid(MJ,hasPO?"Majors":"")}${grid(PO.filter(k=>CFG.events.some(e=>majOf(e)===k&&hasData(e))),"FedEx Cup Playoffs")}</div>`;
  $("#drawerCard").innerHTML=h}
function setPageFlag(){const pg=STATE.page||"event";document.documentElement.dataset.pg=pg;
  if(pg==="event")applyTheme(CUR.name);else document.documentElement.dataset.ev=(CFG.theme&&CFG.theme!=="auto")?CFG.theme:"masters"}
function openDrawer(){drawDrawer();$("#drawer").classList.add("on");document.body.style.overflow="hidden"}
function closeDrawer(){$("#drawer").classList.remove("on");document.body.style.overflow=""}
function goPage(page){LANDING=false;STATE.page=page;save();closeDrawer();setPageFlag();
  try{history.replaceState(null,"",page==="event"?"?event="+CUR.id:page==="home"?location.pathname:"?page="+page)}catch(e){}
  if(page==="event"){$("#pick").style.display="";drawNav();drawPill();if(D)render();else $("#view").innerHTML=`<div class="card"><div class="empty">Loading ${esc(CUR.name)}…</div></div>`}
  else renderOther();window.scrollTo(0,0)}
function goEvent(id,sel){closeCard();STATE.page="event";$("#pick").style.display="";closeDrawer();if(sel!==undefined)STATE.sel=sel||null;save();setPageFlag();
  if(id===CUR.id){try{history.replaceState(null,"","?event="+CUR.id)}catch(e){}drawNav();drawPill();if(D)render();window.scrollTo(0,0);return}
  drawNav();switchEvent(id);window.scrollTo(0,0)}
document.addEventListener("click",e=>{
  if(e.target.closest("#burger")){openDrawer();return}
  if(e.target.closest("[data-dclose]")){closeDrawer();return}
  if(e.target.closest("[data-devt]")){STATE.devt=!STATE.devt;save();drawDrawer();return}
  const pg=e.target.closest("[data-page]");if(pg){if(pg.dataset.asel!==undefined)STATE.asel=pg.dataset.asel||null;else if(pg.dataset.page==="alltime"&&STATE.page==="home")STATE.asel=null;goPage(pg.dataset.page);return}
  const ge=e.target.closest("[data-goev]");if(ge){goEvent(ge.dataset.goev,ge.dataset.gosel);return}
  const fs=e.target.closest("[data-fser]");if(fs){STATE.fser=fs.dataset.fser;STATE.fmaj="all";save();renderOther();return}
  const fm=e.target.closest("[data-fmaj]");if(fm){STATE.fmaj=fm.dataset.fmaj;save();renderOther();return}
  const fy=e.target.closest("[data-fyr]");if(fy){STATE.fyr=fy.dataset.fyr;save();renderOther();return}
  const ab=e.target.closest("[data-ab]");if(ab&&(STATE.page==="alltime")){const n=ab.dataset.ab||null;STATE.asel=STATE.asel===n?null:n;save();renderOther();if(STATE.asel)window.scrollTo({top:0,behavior:"smooth"});return}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});
document.addEventListener("change",e=>{if(e.target.id==="asel"){STATE.asel=e.target.value||null;save();renderOther()}});

/* refresh right away when the app is reopened from the background */
let lastLoad=0;document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&Date.now()-lastLoad>15000)load()});
window.addEventListener("pageshow",e=>{if(e.persisted)load()});
function switchEvent(id){if(id===CUR.id)return;setEvent(id);STATE.ev=CUR.id;save();
  for(const k in GOOD)delete GOOD[k];for(const k in CARDS)delete CARDS[k];UPDATED=null;SOURCE="";STALE="";EVENT={name:"",id:""};CARD=null;closeCard();
  try{history.replaceState(null,"","?event="+CUR.id)}catch(e){}applyTheme(CUR.name);D=null;$("#view").innerHTML=`<div class="card"><div class="empty">Loading ${esc(CUR.name)}…</div></div>`;load()}
document.addEventListener("change",e=>{if(e.target.id==="evsel"){if(e.target.value)goEvent(e.target.value);return}});
document.addEventListener("change",e=>{if(e.target.id!=="sel")return;STATE.sel=e.target.value||null;save();render()});
(()=>{let id=null,pg=null;try{const q=new URLSearchParams(location.search);id=q.get("event");pg=q.get("page")}catch(e){}
  STATE.page=pg==="alltime"||pg==="stats"||pg==="golfers"?pg:id?"event":"home";
  if(STATE.page==="home"&&!pg&&!id){LANDING=true;const lc=liveCache(),t=Date.now();
    if(lc&&lc.cfg&&t>=lc.start&&t<=lc.to&&CFG.events.some(e=>e.id===lc.cfg&&hasData(e))){STATE.page="event";id=lc.cfg;LANDING=false;try{history.replaceState(null,"","?event="+id)}catch(e){}}}
  setEvent(id&&CFG.events.some(e=>e.id===id)?id:(STATE.ev&&CFG.events.some(e=>e.id===STATE.ev)?STATE.ev:FIRST().id));applyTheme(CUR.name)})();
setPageFlag();drawNav();drawPill();if(STATE.page!=="event")renderOther();
loadLive();
load();
setInterval(load,CFG.refreshSeconds*1000);
</script>
</body></html>
